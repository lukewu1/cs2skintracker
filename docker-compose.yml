services:
  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-users}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./backend
    restart: always
    environment:
      - CSFLOAT_API_KEY=${CSFLOAT_API_KEY}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-users}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
